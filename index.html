<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Club Eric Perrot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1e5fa8;
      --navy-dark: #154a87;
      --navy-bg: #e8f0fb;
      --text: #1a1a18;
      --text2: #6b6b67;
      --bg: #f5f7fa;
      --white: #ffffff;
      --radius: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 64px;
      margin-bottom: 1rem;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: .4rem;
      line-height: 1.2;
    }
    .title span { color: var(--navy); }
    .subtitle {
      font-size: 15px;
      color: var(--text2);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 2px 20px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }
    .card-icon { font-size: 40px; margin-bottom: .75rem; }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .card-desc {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: var(--navy);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 99px;
      text-decoration: none;
      transition: background .15s;
    }
    .btn:hover { background: var(--navy-dark); }
    .footer {
      font-size: 12px;
      color: var(--text2);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎿</div>
    <div class="title">Fan Club <span>Eric Perrot</span></div>
    <div class="subtitle">Suis les performances d'Eric Perrot<br>et retrouve tous les paris de la saison</div>

    <div class="card">
      <div class="card-icon">🎯</div>
      <div class="card-title">Paris Biathlon</div>
      <div class="card-desc">Parie sur la place d'Eric Perrot à chaque course de Coupe du Monde et Championnats du Monde.</div>
      <a href="biathlon.html" class="btn">Accéder aux paris →</a>
    </div>

    <div class="footer">Fan Club Eric Perrot · Saison 2026-2027</div>
  </div>
</body>
</html>
