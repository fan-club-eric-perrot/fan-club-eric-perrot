<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Club Eric Perrot — Ski Alpin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, update, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ─────────────────────────────────────────────────────
    // 🔧 CONFIGURATION FIREBASE
    // Remplace par tes valeurs : Firebase Console > Paramètres > SDK
    // ─────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBFqqCxQayYdJRReoAz-W0_b3qnweuhXRk",
      authDomain: "fan-club-eric-perrot-ski-alpin.firebaseapp.com",
      databaseURL: "https://fan-club-eric-perrot-ski-alpin-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "fan-club-eric-perrot-ski-alpin",
      storageBucket: "fan-club-eric-perrot-ski-alpin.firebasestorage.app",
      messagingSenderId: "916937095466",
      appId: "1:916937095466:web:4de1d7c36fd11b4e304653"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const ADMIN_PSEUDO = 'admin-ski-alpin';

    const S = {
      pseudo:null, season:null, selRace:null, selPlayer:null,
      races:{}, players:{}, skiers:{},
      scoring:[[10,6,4,2,1],[6,10,6,4,2],[4,6,10,6,4],[2,4,6,10,6],[1,2,4,6,10]],
      bets:{}, chart:null, editRaceId:null,
    };

    // ── Helpers ──────────────────────────────────────────
    const el = id => document.getElementById(id);
    const btn = (text, cls, fn) => { const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; b.addEventListener('click',fn); return b; };
    const openModal  = id => el('modal-'+id).classList.add('open');
    const closeModal = id => el('modal-'+id).classList.remove('open');
    const isAdmin = () => S.pseudo === ADMIN_PSEUDO;

    function curSeason() { const d=new Date(),y=d.getFullYear(),m=d.getMonth(); return m>=5?y+'-'+(y+1):(y-1)+'-'+y; }
    function allSeasons() { const sy=parseInt(curSeason().split('-')[0]),list=[]; for(let y=2026;y<=sy+2;y++) list.push(y+'-'+(y+1)); return list.reverse(); }
    function seasonDates(k) { const [y1,y2]=k.split('-').map(Number); return {start:new Date(y1+'-06-01'),end:new Date(y2+'-05-01')}; }
    function isLocked(r) { return new Date()>=new Date(r.date+'T'+r.time)||r.status==='done'; }
    function seasonRaces() {
      const {start,end}=seasonDates(S.season);
      return Object.entries(S.races)
        .filter(([,r])=>{const d=new Date(r.date);return d>=start&&d<end;})
        .sort((a,b)=>new Date(a[1].date+'T'+a[1].time)-new Date(b[1].date+'T'+b[1].time));
    }
    function regularPlayers() { return Object.entries(S.players).filter(([p])=>p!==ADMIN_PSEUDO); }
    function calcPts(picks,results) {
      if(!picks||!results||!results.length) return 0;
      const filled=picks.filter(s=>s&&s!=='');
      if(new Set(filled).size!==filled.length) return 0;
      let pts=0;
      picks.forEach((sk,i)=>{const j=results.indexOf(sk);if(j>=0&&j<5) pts+=S.scoring[i][j];});
      return pts;
    }
    function ptFor(i,skier,results) { const j=results.indexOf(skier); return (j>=0&&j<5)?S.scoring[i][j]:0; }

    // ── Firebase helpers ──────────────────────────────────
    const dbGet    = async path => { const s=await get(ref(db,path)); return s.exists()?s.val():null; };
    const dbSet    = async (path,val) => set(ref(db,path),val);
    const dbUpdate = async (path,val) => update(ref(db,path),val);
    const dbRemove = async path => remove(ref(db,path));
    const dbPush   = async (path,val) => push(ref(db,path),val);

    async function loadAll() {
      const [races,players,skiers,scoring,bets] = await Promise.all([
        dbGet('races'),dbGet('players'),dbGet('skiers'),dbGet('scoring'),dbGet('bets')
      ]);
      S.races=races||{}; S.players=players||{}; S.skiers=skiers||{}; S.bets=bets||{};
      if(scoring) S.scoring=scoring;
      if(!Object.keys(S.skiers).length) {
        const names=['Aicher Emil','Allegre Nils','Bailet Matthieu','Braathen Lucas','Caviezel Mauro',
          'Cochran-Siegle Ryan','Feller Manuel','Foss-Solevaag Sebastian','Giezendanner Blaise',
          'Hadalin Stefan','Haugan Timon','Jocher Simon','Kilde Aleksander','Kristoffersen Henrik',
          'Kryenbuehl Urs','Kueng Stefan','McGrath Atle Lie','Meillard Loic','Monney Alexis',
          'Murisier Justin','Noel Clement','Odermatt Marco','Paris Dominik','Pinturault Alexis',
          'Raschner Dominik','Rassat Paco','Sarrazin Cyprien','Schmid Alexander','Schwarz Marco',
          'Steen Olsen Alexander','Striedinger Otmar','von Allmen Franjo','Yule Daniel',
          'Zenhaeusern Ramon','Zubcic Filip','Brignone Federica','Bassino Marta','Goggia Sofia',
          'Gut-Behrami Lara','Gisin Michelle','Holdener Wendy','Liensberger Katharina',
          'Rast Camille','Shiffrin Mikaela','Vlhova Petra'].sort();
        const obj={};
        names.forEach((name,i)=>{obj['s'+i]={name};});
        await dbSet('skiers',obj); S.skiers=obj;
      }
    }

    // ── Auth ──────────────────────────────────────────────
    async function doLogin() {
      const pseudo=el('loginPseudo').value.trim();
      const errEl=el('loginError');
      errEl.classList.add('hidden');
      if(!pseudo){errEl.textContent='Entre ton pseudo.';errEl.classList.remove('hidden');return;}
      if(pseudo===ADMIN_PSEUDO){
        S.pseudo=pseudo;
        if(!S.players[ADMIN_PSEUDO]) await dbSet('players/'+ADMIN_PSEUDO,{pseudo:ADMIN_PSEUDO,isAdmin:true});
        bootApp(); return;
      }
      if(S.players[pseudo]){S.pseudo=pseudo;bootApp();return;}
      errEl.textContent='Pseudo introuvable. Crée ton compte avec "Nouveau joueur".';
      errEl.classList.remove('hidden');
    }

    async function doNewPlayer() {
      const pseudo=el('newPseudoInput').value.trim();
      const errEl=el('newPseudoError');
      errEl.classList.add('hidden');
      if(!pseudo){errEl.textContent='Entre un pseudo.';errEl.classList.remove('hidden');return;}
      if(pseudo===ADMIN_PSEUDO){errEl.textContent='Ce pseudo est réservé.';errEl.classList.remove('hidden');return;}
      if(S.players[pseudo]){errEl.textContent='Ce pseudo est déjà pris.';errEl.classList.remove('hidden');return;}
      await dbSet('players/'+pseudo,{pseudo,isAdmin:false});
      S.players[pseudo]={pseudo,isAdmin:false};
      S.pseudo=pseudo;
      closeModal('newPlayer');
      bootApp();
    }

    function doLogout() {
      S.pseudo=null;
      el('mainApp').classList.add('hidden');
      el('loginScreen').classList.remove('hidden');
      el('loginPseudo').value='';
      el('loginError').classList.add('hidden');
    }

    // ── Boot ──────────────────────────────────────────────
    function bootApp() {
      el('loginScreen').classList.add('hidden');
      el('mainApp').classList.remove('hidden');
      el('userLabel').textContent=S.pseudo;
      const av=el('avatarEl');
      av.textContent=S.pseudo[0].toUpperCase();
      if(isAdmin()) av.classList.add('admin'); else av.classList.remove('admin');
      document.querySelectorAll('.admin-only').forEach(e=>e.classList.toggle('hidden',!isAdmin()));
      S.season=curSeason();
      el('seasonSel').innerHTML=allSeasons().map(s=>'<option value="'+s+'"'+(s===S.season?' selected':'')+'>'+s+'</option>').join('');
      showTab('courses');
    }

    // ── Navigation ────────────────────────────────────────
    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
      document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
      el('section-'+name).classList.remove('hidden');
      if(name==='courses')    renderCourses();
      if(name==='pronostics') renderPronostics();
      if(name==='classement') renderClassement();
      if(name==='reglages')   renderReglages();
    }

    // ── Courses ───────────────────────────────────────────
    function statusBadge(r) {
      if(r.status==='done') return '<span class="badge badge-green">Terminée</span>';
      if(isLocked(r))       return '<span class="badge badge-gray">En cours</span>';
      return '<span class="badge badge-blue">Pronostics ouverts</span>';
    }

    function renderCourses() {
      const container=el('section-courses'); container.innerHTML='';
      const races=seasonRaces(),adm=isAdmin(),ps=regularPlayers();
      const {start,end}=seasonDates(S.season);
      const fmt=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
      const banner=document.createElement('div'); banner.className='info-banner';
      banner.textContent='Saison '+S.season+' · '+fmt(start)+' – '+fmt(end);
      container.appendChild(banner);
      if(!races.length){const e=document.createElement('div');e.className='empty';e.textContent='Aucune course.'+(adm?' Ajoutes-en dans Réglages.':'');container.appendChild(e);return;}
      races.forEach(([raceId,r])=>{
        const card=document.createElement('div'); card.className='card';
        const d=new Date(r.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        const myPicks=S.bets[raceId]?S.bets[raceId][S.pseudo]:null;
        const myPts=(r.status==='done'&&myPicks)?calcPts(myPicks,r.results||[]):null;
        const betCount=S.bets[raceId]?Object.keys(S.bets[raceId]).filter(p=>p!==ADMIN_PSEUDO).length:0;
        let inner='<div class="card-header"><div><div class="card-title">'+r.name+' — '+r.discipline+'</div>';
        inner+='<div class="card-sub">'+d+' à '+r.time+' · '+(r.gender==='F'?'Femmes':'Hommes')+'</div></div>'+statusBadge(r)+'</div>';
        if(myPts!==null) inner+='<div style="font-size:13px;margin-bottom:8px;color:var(--text2)">Ton score : <strong style="color:var(--text)">'+myPts+' pts</strong></div>';
        if(!adm&&!isLocked(r)&&!myPicks) inner+='<div style="font-size:13px;color:var(--red);margin-bottom:8px">Tu n\'as pas encore saisi ton pronostic !</div>';
        if(r.status==='done'&&r.results&&r.results.length){
          inner+='<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Résultats officiels</div>';
          r.results.forEach((s,i)=>{inner+='<div class="res-row"><span style="min-width:22px">'+['🥇','🥈','🥉','4️⃣','5️⃣'][i]+'</span><span>'+s+'</span></div>';});
          inner+='</div>';
        }
        card.innerHTML=inner;
        const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px';
        const counter=document.createElement('span'); counter.style.cssText='font-size:12px;color:var(--text3)'; counter.textContent=betCount+'/'+ps.length+' pronostics';
        row.appendChild(counter);
        if(!adm&&!isLocked(r)) row.insertBefore(btn('Mon pronostic','btn btn-primary btn-sm',()=>{S.selRace=raceId;S.selPlayer=null;showTab('pronostics');}),counter);
        if(isLocked(r)&&r.status==='done') row.insertBefore(btn('Voir les paris','btn btn-sm',()=>{S.selRace=raceId;S.selPlayer=null;showTab('pronostics');}),counter);
        if(adm&&isLocked(r)&&r.status!=='done') row.insertBefore(btn('Saisir résultats','btn btn-primary btn-sm',()=>openResultsModal(raceId)),counter);
        if(adm&&r.status==='done') row.insertBefore(btn('Modifier résultats','btn btn-sm',()=>openResultsModal(raceId)),counter);
        card.appendChild(row); container.appendChild(card);
      });
    }

    // ── Pronostics ────────────────────────────────────────
    function renderPronostics() {
      const container=el('section-pronostics'); container.innerHTML='';
      const races=seasonRaces();
      if(!races.length){container.innerHTML='<div class="empty">Aucune course pour cette saison.</div>';return;}

      // Menu déroulant
      const selWrap=document.createElement('div'); selWrap.style.cssText='margin-bottom:1rem';
      const sel=document.createElement('select'); sel.className='fi';
      sel.style.cssText='font-size:14px;padding:10px 12px;cursor:pointer';
      const optBlank=document.createElement('option'); optBlank.value=''; optBlank.textContent='— Sélectionne une course —'; sel.appendChild(optBlank);
      races.forEach(([raceId,r])=>{
        const d=new Date(r.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
        const opt=document.createElement('option');
        opt.value=raceId;
        opt.textContent=r.name+' — '+r.discipline+' · '+d;
        if(S.selRace===raceId) opt.selected=true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change',()=>{S.selRace=sel.value||null;S.selPlayer=null;renderPronostics();});
      selWrap.appendChild(sel); container.appendChild(selWrap);

      if(!S.selRace){const e=document.createElement('div');e.className='empty';e.textContent='Sélectionne une course.';container.appendChild(e);return;}
      const entry=races.find(([id])=>id===S.selRace); if(!entry) return;
      const [raceId,race]=entry,lk=isLocked(race),adm=isAdmin(),ps=regularPlayers();
      if(!lk&&!adm){S.selPlayer=S.pseudo;const a=document.createElement('div');container.appendChild(a);renderBetForm(a,raceId,race);return;}
      if(!lk&&adm){const lbl=document.createElement('div');lbl.style.cssText='font-size:13px;color:var(--text2);margin-bottom:8px';lbl.textContent='Pronostics saisis (lecture seule) :';container.appendChild(lbl);buildPlayerSelector(container,raceId,race,ps);return;}
      const lbl=document.createElement('div');lbl.style.cssText='font-size:13px;color:var(--text2);margin-bottom:8px';lbl.textContent='Voir les pronostics de :';container.appendChild(lbl);
      buildPlayerSelector(container,raceId,race,ps);
    }

    function buildPlayerSelector(container,raceId,race,ps) {
      const adm=isAdmin();
      if(!S.selPlayer&&ps.length) S.selPlayer=adm?ps[0][0]:S.pseudo;
      const selWrap=document.createElement('div'); selWrap.style.cssText='margin-bottom:1rem';
      const sel=document.createElement('select'); sel.className='fi';
      sel.style.cssText='font-size:14px;padding:10px 12px;cursor:pointer';
      ps.forEach(([pseudo])=>{
        const opt=document.createElement('option');
        opt.value=pseudo; opt.textContent=pseudo;
        if(S.selPlayer===pseudo) opt.selected=true;
        sel.appendChild(opt);
      });
      const formArea=document.createElement('div');
      sel.addEventListener('change',()=>{
        S.selPlayer=sel.value;
        formArea.innerHTML='';
        renderBetForm(formArea,raceId,race);
      });
      selWrap.appendChild(sel);
      container.appendChild(selWrap); container.appendChild(formArea);
      renderBetForm(formArea,raceId,race);
    }

    function renderBetForm(container,raceId,race) {
      container.innerHTML=''; if(!S.selPlayer) return;
      const lk=isLocked(race),adm=isAdmin(),isOwn=S.selPlayer===S.pseudo;
      const readonly=lk||(adm&&!isOwn)||(!adm&&!isOwn);
      const picks=(S.bets[raceId]&&S.bets[raceId][S.selPlayer])||['','','','',''];
      const results=race.results||[];
      const pts=(lk&&results.length)?calcPts(picks,results):null;

      // Info card de la course
      const infoCard=document.createElement('div'); infoCard.className='card';
      infoCard.style.cssText='margin-bottom:12px;background:var(--bg2)';
      const fullDate=new Date(race.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      let statusBadgeHtml=lk?(race.status==='done'?'<span class="badge badge-green">Terminée</span>':'<span class="badge badge-gray">En cours</span>'):'<span class="badge badge-blue">Pronostics ouverts</span>';
      infoCard.innerHTML='<div class="card-header"><div><div class="card-title">'+race.name+'</div><div class="card-sub">'+race.discipline+' · '+fullDate+' à '+race.time+'</div></div>'+statusBadgeHtml+'</div>';
      container.appendChild(infoCard);

      const card=document.createElement('div'); card.className='card';
      let h='<div class="card-header"><span class="card-title">'+S.selPlayer+'</span>';
      h+=lk?'<span class="badge badge-gray">Course passée</span>':'<span class="badge badge-blue">Ouvert</span>';
      h+='</div>';
      if(pts!==null) h+='<div style="font-size:14px;margin-bottom:12px">Score : <strong>'+pts+' pts</strong></div>';
      const sorted=Object.values(S.skiers).sort((a,b)=>a.name.localeCompare(b.name));
      ['1er','2e','3e','4e','5e'].forEach((pos,i)=>{
        const val=picks[i]||''; let pill='';
        if(lk&&results.length&&val){const pv=ptFor(i,val,results);pill=pv>0?'<span class="pts-pill '+(results[i]===val?'pts-exact':'pts-partial')+'">+'+pv+' pts</span>':'<span class="pts-pill pts-none">0 pt</span>';}
        h+='<div class="pos-row"><span class="pos-lbl">'+pos+'</span>';
        if(readonly) h+='<div style="flex:1;padding:6px 10px;font-size:13px;border:.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2)">'+(val||'—')+'</div>'+pill;
        else h+='<select class="pos-val" id="pi_'+i+'"><option value="">— Choisir —</option>'+sorted.map(s=>'<option value="'+s.name+'"'+(s.name===val?' selected':'')+'>'+s.name+'</option>').join('')+'</select>';
        h+='</div>';
      });
      card.innerHTML=h;
      if(!readonly){
        const sb=btn('Enregistrer mon pronostic','btn btn-primary',async()=>{
          if(isLocked(race)){alert('Trop tard !');return;}
          const np=[0,1,2,3,4].map(i=>el('pi_'+i).value.trim());
          const filled=np.filter(s=>s!=='');
          if(new Set(filled).size!==filled.length){alert('Tu as sélectionné le même skieur à deux positions !');return;}
          await dbSet('bets/'+raceId+'/'+S.pseudo,np);
          if(!S.bets[raceId]) S.bets[raceId]={};
          S.bets[raceId][S.pseudo]=np;
          renderBetForm(container,raceId,race); renderCourses();
        });
        sb.style.marginTop='10px'; card.appendChild(sb);
      }
      container.appendChild(card);
    }

    // ── Classement ────────────────────────────────────────
    async function renderClassement() {
      const container=el('section-classement');
      container.innerHTML='<div class="loading"><div class="spinner"></div> Chargement...</div>';
      const doneRaces=seasonRaces().filter(([,r])=>r.status==='done'&&r.results&&r.results.length);
      const ps=regularPlayers();
      const scores=ps.map(([pseudo])=>{
        let total=0; const history=[],detail=[];
        doneRaces.forEach(([raceId,r])=>{
          const picks=S.bets[raceId]?S.bets[raceId][pseudo]:null;
          const pts=picks?calcPts(picks,r.results):0;
          total+=pts; history.push(total); if(picks) detail.push(r.name+': '+pts+'pts');
        });
        return {pseudo,total,history,detail};
      }).sort((a,b)=>b.total-a.total);
      container.innerHTML='<div style="font-size:12px;color:var(--text2);margin-bottom:1rem">Saison '+S.season+' · '+doneRaces.length+' course'+(doneRaces.length!==1?'s':'')+' terminée'+(doneRaces.length!==1?'s':'')+'</div>';
      const lbCard=document.createElement('div'); lbCard.className='card'; lbCard.style.marginBottom='12px';
      const rankC=['gold','silver','bronze'];
      if(scores.length) scores.forEach((s,i)=>{const row=document.createElement('div');row.className='lb-row';row.innerHTML='<div class="lb-rank '+(rankC[i]||'')+'">'+(i+1)+'</div><div style="flex:1"><div class="lb-name">'+s.pseudo+'</div></div><div class="lb-pts">'+s.total+' pts</div>';lbCard.appendChild(row);});
      else lbCard.innerHTML='<div class="empty">Aucun résultat.</div>';
      container.appendChild(lbCard);
      if(doneRaces.length>=1&&scores.length){
        const cc=document.createElement('div'); cc.className='card';
        cc.innerHTML='<div style="font-size:14px;font-weight:600;margin-bottom:12px">Évolution</div><div class="chart-wrap"><canvas id="evoChart"></canvas></div>';
        container.appendChild(cc);
        setTimeout(()=>{
          const ctx=el('evoChart'); if(!ctx) return;
          if(S.chart){S.chart.destroy();S.chart=null;}
          const palette=['#1D9E75','#378ADD','#D85A30','#7F77DD','#BA7517','#639922','#D4537E'];
          S.chart=new Chart(ctx,{type:'line',data:{labels:doneRaces.map(([,r])=>r.name.split(' ').slice(0,2).join(' ')),datasets:scores.map((s,i)=>({label:s.pseudo,data:s.history,borderColor:palette[i%palette.length],backgroundColor:'transparent',tension:.3,pointRadius:5,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:12},boxWidth:12,padding:16}},tooltip:{mode:'index',intersect:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:11}},grid:{color:'rgba(128,128,128,.12)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}});
        },50);
      }
    }

    // ── Réglages ──────────────────────────────────────────
    function renderReglages() {
      if(!isAdmin()){el('section-reglages').innerHTML='<div class="empty">Accès réservé à l\'administrateur.</div>';return;}
      const container=el('section-reglages'); container.innerHTML='';

      // Joueurs
      const pb=document.createElement('div'); pb.className='sec-block';
      pb.innerHTML='<div class="sec-lbl">Joueurs inscrits</div>';
      const pl=document.createElement('div');
      const players=regularPlayers();
      if(!players.length){pl.innerHTML='<div style="font-size:13px;color:var(--text2)">Aucun joueur encore.</div>';}
      else players.forEach(([pseudo])=>{
        const row=document.createElement('div'); row.className='s-row';
        row.innerHTML='<div class="s-info"><div class="s-name">'+pseudo+'</div></div>';
        row.appendChild(btn('Supprimer','btn btn-sm btn-danger',async()=>{
          if(!confirm('Supprimer '+pseudo+' ?')) return;
          await dbRemove('players/'+pseudo); delete S.players[pseudo]; renderReglages();
        }));
        pl.appendChild(row);
      });
      pb.appendChild(pl); container.appendChild(pb);

      // Courses
      const rb=document.createElement('div'); rb.className='sec-block';
      rb.innerHTML='<div class="sec-lbl">Courses — saison '+S.season+'</div><div style="font-size:12px;color:var(--text2);margin-bottom:8px">Les courses sont ajoutées pour la saison visible en haut à droite.</div>';
      const rl=document.createElement('div'); rl.id='raceListAdmin'; renderRaceList(rl);
      rb.appendChild(rl); rb.appendChild(btn('+ Ajouter une course','btn btn-sm',openAddRace)); container.appendChild(rb);

      // Coureurs
      const sb=document.createElement('div'); sb.className='sec-block';
      sb.innerHTML='<div class="sec-lbl">Liste des coureurs</div>';
      const sl=document.createElement('div'); sl.id='skierListContainer'; renderSkierList(sl);
      sb.appendChild(sl); sb.appendChild(btn('+ Ajouter un coureur','btn btn-sm',()=>openModal('addSkier'))); container.appendChild(sb);

      // Barème
      const scb=document.createElement('div'); scb.className='sec-block';
      scb.innerHTML='<div class="sec-lbl">Barème — matrice 5×5</div>';
      const sc=document.createElement('div'); sc.className='card';
      const pos=['1er','2e','3e','4e','5e'];
      let mh='<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Ligne = position pariée · Colonne = résultat réel</div>';
      mh+='<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="rh"></th>'+pos.map(l=>'<th>Réel '+l+'</th>').join('')+'</tr></thead><tbody>';
      for(let i=0;i<5;i++){mh+='<tr><td style="font-weight:600;color:var(--text);background:var(--bg2);font-size:12px;padding-left:8px">Parié '+pos[i]+'</td>';for(let j=0;j<5;j++){const diag=i===j;mh+='<td style="'+(diag?'background:rgba(29,158,117,.08)':'')+'""><input type="number" class="mx-in'+(diag?' diag':'')+'" id="sc_'+i+'_'+j+'" value="'+S.scoring[i][j]+'" min="0" max="99"/></td>';}mh+='</tr>';}
      mh+='</tbody></table></div>'; sc.innerHTML=mh;
      const scbtns=document.createElement('div'); scbtns.style.cssText='margin-top:14px;display:flex;gap:8px;align-items:center';
      const savedMsg=document.createElement('span'); savedMsg.id='scoringSaved'; savedMsg.className='hidden'; savedMsg.style.cssText='font-size:12px;color:var(--green-tx)'; savedMsg.textContent='Enregistré !';
      scbtns.appendChild(btn('Enregistrer','btn btn-primary btn-sm',async()=>{
        const matrix=[];for(let i=0;i<5;i++){matrix.push([]);for(let j=0;j<5;j++) matrix[i].push(parseInt(el('sc_'+i+'_'+j).value)||0);}
        await dbSet('scoring',matrix); S.scoring=matrix; savedMsg.classList.remove('hidden'); setTimeout(()=>savedMsg.classList.add('hidden'),2000);
      }));
      scbtns.appendChild(btn('Réinitialiser','btn btn-sm',()=>{S.scoring=[[10,6,4,2,1],[6,10,6,4,2],[4,6,10,6,4],[2,4,6,10,6],[1,2,4,6,10]];for(let i=0;i<5;i++)for(let j=0;j<5;j++){const inp=el('sc_'+i+'_'+j);if(inp)inp.value=S.scoring[i][j];}}));
      scbtns.appendChild(savedMsg); sc.appendChild(scbtns); scb.appendChild(sc); container.appendChild(scb);
    }

    function renderRaceList(container) {
      container.innerHTML='';
      const races=seasonRaces();
      if(!races.length){container.innerHTML='<div style="font-size:13px;color:var(--text2);margin-bottom:8px">Aucune course pour cette saison.</div>';return;}
      races.forEach(([raceId,r])=>{
        const d=new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
        const row=document.createElement('div'); row.className='s-row';
        row.innerHTML='<div class="s-info"><div class="s-name">'+r.name+'</div><div class="s-sub">'+d+' '+r.time+' · '+r.discipline+' · '+(r.gender==='F'?'Femmes':'Hommes')+'</div></div>';
        row.appendChild(btn('Modifier','btn btn-sm',()=>openEditRace(raceId)));
        row.appendChild(btn('Suppr.','btn btn-sm btn-danger',async()=>{if(!confirm('Supprimer ?')) return;await dbRemove('races/'+raceId);delete S.races[raceId];renderReglages();renderCourses();}));
        container.appendChild(row);
      });
    }

    function renderSkierList(container) {
      container.innerHTML='';
      Object.entries(S.skiers).sort((a,b)=>a[1].name.localeCompare(b[1].name)).forEach(([id,s])=>{
        const tag=document.createElement('span'); tag.className='tag'; tag.textContent=s.name;
        const rm=document.createElement('span'); rm.className='tag-rm'; rm.textContent='×';
        rm.addEventListener('click',async()=>{if(!confirm('Supprimer '+s.name+' ?')) return;await dbRemove('skiers/'+id);delete S.skiers[id];const c=el('skierListContainer');if(c)renderSkierList(c);});
        tag.appendChild(rm); container.appendChild(tag);
      });
    }

    // ── Modals courses ────────────────────────────────────
    function openAddRace() {
      el('addRaceTitle').textContent='Nouvelle course — '+S.season; el('rn_name').value=''; el('raceError').classList.add('hidden');
      const {start,end}=seasonDates(S.season);
      el('rn_date').value=new Date((start.getTime()+end.getTime())/2).toISOString().split('T')[0];
      openModal('addRace');
    }
    async function saveRace() {
      const name=el('rn_name').value.trim(),disc=el('rn_disc').value,gender=el('rn_gender').value;
      const date=el('rn_date').value,time=el('rn_time').value,errEl=el('raceError');
      errEl.classList.add('hidden');
      if(!name||!date){errEl.textContent='Nom et date obligatoires.';errEl.classList.remove('hidden');return;}
      const {start,end}=seasonDates(S.season),d=new Date(date);
      if(d<start||d>=end){errEl.textContent='Date hors saison '+S.season+'.';errEl.classList.remove('hidden');return;}
      const r={name,discipline:disc,gender,date,time,season:S.season,status:'upcoming',results:[]};
      const newRef=await dbPush('races',r); S.races[newRef.key]=r;
      closeModal('addRace'); renderReglages(); renderCourses();
    }
    function openEditRace(raceId) {
      S.editRaceId=raceId; const r=S.races[raceId];
      el('editRaceBody').innerHTML='<div class="form-group"><label class="lbl">Nom / Lieu</label><input class="fi" id="er_name" value="'+r.name+'" /></div><div class="form-row"><div class="form-group"><label class="lbl">Discipline</label><select class="fi" id="er_disc">'+['Slalom','Géant','Super-G','Descente','Combiné'].map(d=>'<option'+(r.discipline===d?' selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="form-group"><label class="lbl">Genre</label><select class="fi" id="er_gender"><option value="H"'+(r.gender==='H'?' selected':'')+'>Hommes</option><option value="F"'+(r.gender==='F'?' selected':'')+'>Femmes</option></select></div></div><div class="form-row"><div class="form-group"><label class="lbl">Date</label><input class="fi" type="date" id="er_date" value="'+r.date+'" /></div><div class="form-group"><label class="lbl">Heure</label><input class="fi" type="time" id="er_time" value="'+r.time+'" /></div></div>';
      openModal('editRace');
    }
    async function saveEditRace() {
      const r=S.races[S.editRaceId];
      const u={name:el('er_name').value.trim()||r.name,discipline:el('er_disc').value,gender:el('er_gender').value,date:el('er_date').value,time:el('er_time').value};
      await dbUpdate('races/'+S.editRaceId,u); Object.assign(S.races[S.editRaceId],u);
      closeModal('editRace'); renderReglages(); renderCourses();
    }
    function openResultsModal(raceId) {
      S.editRaceId=raceId; const r=S.races[raceId];
      el('resultsTitle').textContent='Résultats — '+r.name;
      const res=r.results||[];
      const sorted=Object.values(S.skiers).sort((a,b)=>a.name.localeCompare(b.name));
      const opts='<option value="">— Choisir —</option>'+sorted.map(s=>'<option value="'+s.name+'">'+s.name+'</option>').join('');
      el('resultsBody').innerHTML=[0,1,2,3,4].map(i=>'<div class="pos-row"><span class="pos-lbl">'+['1er','2e','3e','4e','5e'][i]+'</span><select class="pos-val" id="ri_'+i+'">'+opts+'</select></div>').join('');
      [0,1,2,3,4].forEach(i=>{if(res[i]){const s=el('ri_'+i);if(s){Array.from(s.options).forEach(o=>{if(o.value===res[i])o.selected=true;});}}});
      openModal('results');
    }
    async function saveResults() {
      const results=[0,1,2,3,4].map(i=>el('ri_'+i).value.trim()).filter(Boolean);
      const status=results.length===5?'done':'open';
      await dbUpdate('races/'+S.editRaceId,{results,status});
      S.races[S.editRaceId].results=results; S.races[S.editRaceId].status=status;
      closeModal('results'); renderCourses(); renderClassement();
    }
    async function saveSkier() {
      const name=el('newSkierName').value.trim(); if(!name) return;
      const newRef=await dbPush('skiers',{name}); S.skiers[newRef.key]={name};
      el('newSkierName').value=''; closeModal('addSkier');
      const c=el('skierListContainer'); if(c) renderSkierList(c);
    }

    // ── Init ──────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      await loadAll();
      el('btnLogin').addEventListener('click', doLogin);
      el('loginPseudo').addEventListener('keydown', e=>{if(e.key==='Enter') doLogin();});
      el('btnNewPlayer').addEventListener('click', ()=>{el('newPseudoInput').value='';el('newPseudoError').classList.add('hidden');openModal('newPlayer');});
      el('btnSaveNewPlayer').addEventListener('click', doNewPlayer);
      el('newPseudoInput').addEventListener('keydown', e=>{if(e.key==='Enter') doNewPlayer();});
      el('btnCancelNewPlayer').addEventListener('click', ()=>closeModal('newPlayer'));
      el('btnLogout').addEventListener('click', doLogout);
      document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab)));
      el('seasonSel').addEventListener('change',()=>{S.season=el('seasonSel').value;S.selRace=null;S.selPlayer=null;showTab(document.querySelector('.tab.active')?.dataset.tab||'courses');});
      el('btnCancelRace').addEventListener('click',()=>closeModal('addRace'));
      el('btnSaveRace').addEventListener('click',saveRace);
      el('btnCancelEditRace').addEventListener('click',()=>closeModal('editRace'));
      el('btnSaveEditRace').addEventListener('click',saveEditRace);
      el('btnCancelResults').addEventListener('click',()=>closeModal('results'));
      el('btnSaveResults').addEventListener('click',saveResults);
      el('btnCancelSkier').addEventListener('click',()=>closeModal('addSkier'));
      el('btnSaveSkier').addEventListener('click',saveSkier);
      document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
    });
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#fff;--bg2:#f5f5f3;--bg3:#efefec;--border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);--text:#1a1a18;--text2:#6b6b67;--text3:#9b9b96;--green:#1D9E75;--green-bg:#EAF3DE;--green-tx:#3B6D11;--amber-bg:#FAEEDA;--amber-tx:#854F0B;--red:#A32D2D;--red-bg:#FCEBEB;--blue-bg:#E6F1FB;--blue-tx:#0C447C;--radius:10px;--radius-sm:6px}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
    #app{max-width:720px;margin:0 auto;padding:1rem}
    .hidden{display:none!important}
    .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem}
    .brand{font-size:16px;font-weight:600}.brand span{color:var(--green)}
    .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--blue-tx);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
    .avatar.admin{background:#EEEDFE;color:#534AB7}
    select.season-sel{padding:5px 10px;font-size:13px;border:.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);cursor:pointer}
    .tabs{display:flex;gap:2px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:1rem;overflow-x:auto}
    .tab{padding:7px 16px;font-size:13px;font-weight:500;border-radius:var(--radius-sm);border:none;cursor:pointer;background:none;color:var(--text2);white-space:nowrap}
    .tab:hover{background:var(--bg2);color:var(--text)}.tab.active{background:var(--bg3);color:var(--text)}
    .card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:12px}
    .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
    .card-title{font-size:15px;font-weight:600}.card-sub{font-size:12px;color:var(--text2);margin-top:2px}
    .badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
    .badge-green{background:var(--green-bg);color:var(--green-tx)}.badge-blue{background:var(--blue-bg);color:var(--blue-tx)}.badge-gray{background:var(--bg2);color:var(--text2)}
    .btn{padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--radius-sm);cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text)}
    .btn:hover{background:var(--bg2)}.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-primary:hover{opacity:.85;background:var(--text)}
    .btn-sm{padding:5px 10px;font-size:12px}.btn-danger{border-color:#E24B4A;color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
    .form-group{margin-bottom:12px}label.lbl{font-size:13px;color:var(--text2);display:block;margin-bottom:4px}
    input.fi,select.fi{width:100%;padding:8px 10px;font-size:14px;border:.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text)}
    input.fi:focus,select.fi:focus{outline:none;border-color:var(--green)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pos-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.pos-lbl{font-size:13px;color:var(--text2);font-weight:500;min-width:28px}
    .pos-val{flex:1;padding:6px 10px;font-size:13px;border:.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text)}.pos-val:focus{outline:none;border-color:var(--green)}
    .pts-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
    .pts-exact{background:var(--green-bg);color:var(--green-tx)}.pts-partial{background:var(--amber-bg);color:var(--amber-tx)}.pts-none{background:var(--bg2);color:var(--text3)}
    .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .pill{padding:5px 13px;border-radius:99px;font-size:13px;cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text2)}
    .pill:hover{border-color:var(--green);color:var(--text)}.pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--bg2);border-radius:99px;font-size:13px;margin:3px}
    .tag-rm{cursor:pointer;color:var(--text3);font-size:15px;line-height:1}.tag-rm:hover{color:var(--red)}
    .lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)}.lb-row:last-child{border-bottom:none}
    .lb-rank{font-size:18px;font-weight:700;min-width:28px;color:var(--text2)}.lb-rank.gold{color:#BA7517}.lb-rank.silver{color:#888780}.lb-rank.bronze{color:#993C1D}
    .lb-name{flex:1;font-weight:600}.lb-detail{font-size:12px;color:var(--text3)}.lb-pts{font-weight:600;font-size:15px}
    .res-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--border)}.res-row:last-child{border-bottom:none}
    .matrix-wrap{overflow-x:auto}table.matrix{border-collapse:collapse;min-width:300px;width:100%}
    table.matrix th{font-size:11px;font-weight:500;color:var(--text2);background:var(--bg2);padding:6px 8px;text-align:center}table.matrix th.rh{text-align:left;min-width:100px}
    table.matrix td{padding:4px 5px;text-align:center;border:.5px solid var(--border)}table.matrix tr:nth-child(even) td{background:var(--bg2)}
    .mx-in{width:50px;padding:4px;font-size:13px;text-align:center;border:.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text)}.mx-in.diag{border-color:var(--green);font-weight:600}
    .info-banner{font-size:12px;color:var(--text2);background:var(--bg2);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:1rem}
    .empty{text-align:center;padding:2rem;color:var(--text2);font-size:14px}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}.modal-bg.open{display:flex}
    .modal{background:var(--bg);border-radius:var(--radius);padding:1.5rem;max-width:480px;width:92%;border:.5px solid var(--border);max-height:90vh;overflow-y:auto}
    .modal-title{font-size:16px;font-weight:600;margin-bottom:1rem}.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
    .s-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid var(--border)}.s-row:last-child{border-bottom:none}
    .s-info{flex:1}.s-name{font-size:14px;font-weight:500}.s-sub{font-size:12px;color:var(--text2)}
    .sec-lbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}.sec-block{margin-bottom:1.5rem}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .loading{display:flex;align-items:center;gap:10px;padding:2rem;color:var(--text2);justify-content:center}
    #loginScreen{max-width:380px;margin:3rem auto}.login-brand{font-size:24px;font-weight:700;margin-bottom:.25rem}.login-brand span{color:var(--green)}
    .login-sub{font-size:14px;color:var(--text2);margin-bottom:1.5rem}.errmsg{font-size:13px;margin-top:5px;color:var(--red)}
    .chart-wrap{position:relative;height:220px;margin-top:1rem}
    @media(max-width:480px){.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app">
  <div id="loginScreen">
    <div class="card" style="padding:1.5rem">
      <div class="login-brand"><span>Fan Club Eric Perrot</span> — Ski Alpin</div>
      <div class="login-sub">Entre ton pseudo pour accéder à tes pronostics</div>
      <div class="form-group"><label class="lbl">Pseudo</label><input class="fi" id="loginPseudo" placeholder="Ton pseudo" autocomplete="off" /></div>
      <div class="errmsg hidden" id="loginError"></div>
      <div style="display:flex;gap:8px;margin-top:.5rem">
        <button class="btn btn-primary" style="flex:1" id="btnLogin">Se connecter</button>
        <button class="btn" id="btnNewPlayer">Nouveau joueur</button>
      </div>
    </div>
  </div>
  <div id="mainApp" class="hidden">
    <div class="top-bar">
      <div class="brand"><span>Fan Club Eric Perrot</span> — Ski Alpin</div>
      <div class="top-right">
        <select class="season-sel" id="seasonSel"></select>
        <div class="avatar" id="avatarEl"></div>
        <span style="font-size:13px;color:var(--text2)" id="userLabel"></span>
        <button class="btn btn-sm" id="btnLogout">Déconnexion</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="courses">Courses</button>
      <button class="tab" data-tab="pronostics">Pronostics</button>
      <button class="tab" data-tab="classement">Classement</button>
      <button class="tab admin-only hidden" data-tab="reglages">Réglages ⚙</button>
    </div>
    <div id="section-courses"    class="section"></div>
    <div id="section-pronostics" class="section hidden"></div>
    <div id="section-classement" class="section hidden"></div>
    <div id="section-reglages"   class="section hidden"></div>
  </div>
</div>

<div class="modal-bg" id="modal-newPlayer">
  <div class="modal">
    <div class="modal-title">Créer mon pseudo</div>
    <div class="form-group"><label class="lbl">Pseudo</label><input class="fi" id="newPseudoInput" placeholder="Choisis ton pseudo" autocomplete="off" /></div>
    <div class="errmsg hidden" id="newPseudoError"></div>
    <div class="modal-footer">
      <button class="btn" id="btnCancelNewPlayer">Annuler</button>
      <button class="btn btn-primary" id="btnSaveNewPlayer">Créer</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="modal-addRace">
  <div class="modal">
    <div class="modal-title" id="addRaceTitle">Nouvelle course</div>
    <div class="form-group"><label class="lbl">Nom / Lieu</label><input class="fi" id="rn_name" placeholder="ex: Kitzbühel" /></div>
    <div class="form-row">
      <div class="form-group"><label class="lbl">Discipline</label><select class="fi" id="rn_disc"><option>Slalom</option><option>Géant</option><option>Super-G</option><option>Descente</option><option>Combiné</option></select></div>
      <div class="form-group"><label class="lbl">Genre</label><select class="fi" id="rn_gender"><option value="H">Hommes</option><option value="F">Femmes</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="lbl">Date</label><input class="fi" type="date" id="rn_date" /></div>
      <div class="form-group"><label class="lbl">Heure</label><input class="fi" type="time" id="rn_time" value="10:00" /></div>
    </div>
    <div class="errmsg hidden" id="raceError"></div>
    <div class="modal-footer"><button class="btn" id="btnCancelRace">Annuler</button><button class="btn btn-primary" id="btnSaveRace">Créer</button></div>
  </div>
</div>
<div class="modal-bg" id="modal-editRace">
  <div class="modal">
    <div class="modal-title">Modifier la course</div>
    <div id="editRaceBody"></div>
    <div class="modal-footer"><button class="btn" id="btnCancelEditRace">Annuler</button><button class="btn btn-primary" id="btnSaveEditRace">Enregistrer</button></div>
  </div>
</div>
<div class="modal-bg" id="modal-results">
  <div class="modal">
    <div class="modal-title" id="resultsTitle">Résultats officiels</div>
    <div id="resultsBody"></div>
    <div class="modal-footer"><button class="btn" id="btnCancelResults">Annuler</button><button class="btn btn-primary" id="btnSaveResults">Enregistrer</button></div>
  </div>
</div>
